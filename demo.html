<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemoOS — terminal memory</title>
<style>
  :root {
    --bg: #080b12;
    --panel: #0f1623;
    --panel-2: #141d2e;
    --line: #223049;
    --line-soft: #182134;
    --ink: #e9eef8;
    --ink-dim: #93a1b8;
    --ink-faint: #61708a;
    --accent: #6366f1;
    --accent-soft: rgba(99,102,241,.14);
    --ok: #34d399;
    --warn: #f59e0b;
    --person: #f472b6;
    --place: #38bdf8;
    --org: #fbbf24;
    --tech: #a78bfa;
    --event: #34d399;
    --other: #94a3b8;
    --memory: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); font-size: 13.5px; line-height: 1.5;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .mono, code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--line-soft);
    background: linear-gradient(180deg, #111b2d, #0b1220); flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 9px; }
  .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .brand span { font-size: 11.5px; color: var(--ink-faint); }
  select, .btn, input {
    border: 1px solid var(--line); background: #0a111d; color: var(--ink);
    border-radius: 8px; font-size: 12.5px; padding: 6px 10px; outline: none;
    font-family: inherit;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .btn { cursor: pointer; color: var(--ink-dim); }
  .btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.12); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.plug { display: flex; align-items: center; gap: 7px; font-weight: 550; }
  .btn.plug .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .btn.plug.off { color: var(--warn); border-color: rgba(245,158,11,.4); }
  .btn.plug.off .dot { background: var(--warn); }
  .stats { display: flex; gap: 7px; margin-left: auto; flex-wrap: wrap; }
  .pill {
    display: flex; align-items: baseline; gap: 5px; padding: 4px 10px;
    border-radius: 999px; background: var(--panel-2);
    border: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-dim);
  }
  .pill b { color: var(--ink); font-size: 12.5px; font-weight: 600; }
  .pill.alert { border-color: var(--warn); color: var(--warn); }
  .pill.alert b { color: var(--warn); }

  main { flex: 1; display: grid; grid-template-columns: 288px 1fr; min-height: 0; }
  aside {
    border-right: 1px solid var(--line-soft); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-scroll { overflow-y: auto; padding: 14px; flex: 1; }
  .label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 650; margin: 0 0 8px;
  }
  .label + .label, .group + .group { margin-top: 18px; }
  .group { display: block; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions .btn { text-align: left; padding: 8px 11px; }
  .hint { font-size: 11px; color: var(--ink-faint); margin-top: 7px; }

  .sess {
    border: 1px solid var(--line-soft); border-radius: 9px; background: var(--panel-2);
    padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font-size: 12px;
  }
  .sess:hover { border-color: var(--accent); }
  .sess.on { border-color: var(--accent); background: var(--accent-soft); }
  .sess .top { display: flex; justify-content: space-between; gap: 8px; }
  .sess .sub { color: var(--ink-faint); font-size: 11px; margin-top: 2px; }

  section.main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 9px 16px;
    border-bottom: 1px solid var(--line-soft); background: var(--panel); flex-shrink: 0;
  }
  .tabs { display: flex; gap: 3px; }
  .tab {
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
    border: 1px solid transparent; background: transparent; color: var(--ink-faint);
  }
  .tab:hover { color: var(--ink-dim); }
  .tab.on { background: var(--accent-soft); border-color: rgba(99,102,241,.35); color: #a5b4fc; }
  .tab .n { font-size: 10.5px; opacity: .7; margin-left: 4px; }
  .pane { flex: 1; overflow: auto; display: none; }
  .pane.on { display: block; }
  .pad { padding: 16px 18px; }

  /* -------------------------------------------------------------- graph */
  #pane-graph { overflow: hidden; position: relative; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph.dragging { cursor: grabbing; }
  .legend {
    position: absolute; left: 14px; bottom: 14px; display: flex; gap: 12px;
    flex-wrap: wrap; background: rgba(10,16,26,.85); border: 1px solid var(--line-soft);
    border-radius: 9px; padding: 8px 12px; font-size: 11px; color: var(--ink-dim);
    backdrop-filter: blur(6px);
  }
  .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .ghint {
    position: absolute; right: 14px; top: 14px; font-size: 11px;
    color: var(--ink-faint); background: rgba(10,16,26,.85);
    border: 1px solid var(--line-soft); border-radius: 9px; padding: 6px 10px;
  }
  .node-label { font-size: 10.5px; fill: var(--ink-dim); pointer-events: none; }
  .edge-label { font-size: 9px; fill: var(--ink-faint); pointer-events: none; }
  #tip {
    position: absolute; pointer-events: none; opacity: 0; transition: opacity .12s;
    background: #0a111d; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 11px; font-size: 12px; max-width: 320px; z-index: 5;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }

  /* ------------------------------------------------------------- cards */
  .card {
    border: 1px solid var(--line-soft); border-radius: 10px; background: var(--panel-2);
    padding: 11px 13px; margin-bottom: 8px;
  }
  .card.dead { opacity: .5; border-style: dashed; }
  .card.dead .text { text-decoration: line-through; }
  .meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
          font-size: 11px; color: var(--ink-faint); margin-top: 7px; }
  .tag { padding: 2px 7px; border-radius: 5px; font-size: 9.5px; font-weight: 650;
         letter-spacing: .05em; text-transform: uppercase; }
  .t-fact { background: rgba(56,189,248,.15); color: var(--place); }
  .t-preference { background: rgba(167,139,250,.15); color: var(--tech); }
  .t-event { background: rgba(52,211,153,.15); color: var(--event); }
  .t-skill { background: rgba(52,211,153,.15); color: var(--event); }
  .t-goal { background: rgba(245,158,11,.15); color: var(--warn); }
  .t-relationship { background: rgba(244,114,182,.15); color: var(--person); }
  .del { margin-left: auto; cursor: pointer; background: none; border: none;
         color: var(--ink-faint); font-size: 14px; }
  .del:hover { color: #f87171; }
  .empty { color: var(--ink-faint); text-align: center; padding: 40px 12px; font-size: 13px; }
  .note { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 11px; }

  /* ---------------------------------------------------------- timeline */
  .ev { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .ev:last-child { border-bottom: none; }
  .ev .t { color: var(--ink-faint); font-size: 11px; min-width: 46px; }
  .ev .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em;
           min-width: 62px; font-weight: 650; }
  .k-command { color: var(--place); }
  .k-claude { color: var(--tech); }
  .k-note { color: var(--org); }
  .k-git { color: var(--event); }
  .ev .x { flex: 1; word-break: break-word; }
  .ev.fail .x { color: #fca5a5; }
  .ev .code { color: #f87171; font-size: 11px; }

  /* ----------------------------------------------------------- search */
  .hit { border: 1px solid var(--line-soft); border-radius: 10px;
         background: var(--panel-2); padding: 11px 13px; margin-bottom: 8px; }
  .bar-s { height: 4px; border-radius: 3px; background: #0a111d; overflow: hidden; margin: 8px 0 7px; }
  .bar-s i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--place)); }
  .badge { padding: 2px 7px; border-radius: 5px; font-size: 9.5px; font-weight: 650;
           letter-spacing: .05em; text-transform: uppercase; }
  .b-vector { background: rgba(56,189,248,.15); color: var(--place); }
  .b-keyword { background: rgba(167,139,250,.15); color: var(--tech); }
  .b-graph { background: rgba(244,114,182,.15); color: var(--person); }
  .nums { display: flex; gap: 11px; flex-wrap: wrap; font-size: 11px;
          color: var(--ink-faint); margin-top: 7px; }
  .nums b { color: var(--ink-dim); font-weight: 600; }
  pre.digest {
    background: #0a111d; border: 1px solid var(--line-soft); border-left: 3px solid var(--accent);
    border-radius: 9px; padding: 11px 13px; font-size: 11.5px; color: var(--ink-dim);
    white-space: pre-wrap; overflow-x: auto;
  }
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 16px; font-size: 12.5px; opacity: 0; transition: all .2s; z-index: 20;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="brand"><h1>MemoOS</h1><span>terminal memory</span></div>
  <button class="btn plug" id="plug" title="attach or detach the terminal"></button>
  <select id="project" title="one memory space per git project"></select>
  <div class="stats" id="stats"></div>
</header>

<main>
  <aside>
    <div class="side-scroll">
      <div class="group">
        <div class="label">Feed the layer</div>
        <div class="actions">
          <button class="btn" id="do-distill">⚗ Distill journal → memory</button>
          <button class="btn" id="do-claude">⌘ Import Claude Code prompts</button>
          <button class="btn" id="do-upload">📄 Upload knowledge base doc</button>
          <input type="file" id="file" hidden accept=".md,.txt,.py,.js,.ts,.json,.yaml,.yml,.rst,.html">
        </div>
        <div class="hint" id="pending-hint"></div>
      </div>

      <div class="group">
        <div class="label">Note something</div>
        <div class="actions">
          <input id="note" placeholder="a decision, a blocker…" autocomplete="off">
        </div>
      </div>

      <div class="group">
        <div class="label">Sessions</div>
        <div id="sessions"></div>
      </div>
    </div>
  </aside>

  <section class="main">
    <div class="bar">
      <div class="tabs">
        <button class="tab on" data-pane="graph">Graph<span class="n" id="n-graph"></span></button>
        <button class="tab" data-pane="memories">Memories<span class="n" id="n-mem"></span></button>
        <button class="tab" data-pane="timeline">Timeline<span class="n" id="n-ev"></span></button>
        <button class="tab" data-pane="search">Search</button>
      </div>
      <button class="btn" id="relayout" style="margin-left:auto">↻ Re-layout</button>
    </div>

    <div class="pane on" id="pane-graph">
      <svg id="graph"></svg>
      <div id="tip"></div>
      <div class="ghint">drag nodes · scroll to zoom · drag background to pan</div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="pane" id="pane-memories"><div class="pad" id="memories"></div></div>
    <div class="pane" id="pane-timeline"><div class="pad" id="timeline"></div></div>
    <div class="pane" id="pane-search"><div class="pad" id="search"></div></div>
  </section>
</main>

<div id="toast"></div>

<script>
const API = location.origin;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let project = null;
let session = null;      // selected session filter, null = all
let graphData = { nodes: [], edges: [] };

const TYPE_COLOR = {
  person: "#f472b6", place: "#38bdf8", org: "#fbbf24",
  tech: "#a78bfa", event: "#34d399", other: "#94a3b8",
};

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    let detail = res.statusText;
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function toast(msg, ms = 2600) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), ms);
}

function clock(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function day(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleDateString([], { day: "numeric", month: "short" });
}

// ==========================================================  force graph
// A small spring/repulsion simulation. Written out rather than pulled from
// a library because the page has to stay self-contained, and the whole
// model is three forces: edges pull, nodes push, the centre gathers.
const G = {
  svg: null, w: 0, h: 0, nodes: [], edges: [],
  tx: 0, ty: 0, scale: 1, timer: null,
};

function buildGraph(data) {
  const byId = new Map();
  G.nodes = data.nodes.map((n, i) => {
    // Seed on a spiral rather than at random: a deterministic start means
    // the same graph lays out the same way twice, so re-rendering after a
    // distill doesn't reshuffle a picture the user had already read.
    const a = i * 2.399, r = 18 * Math.sqrt(i + 1);
    const node = {
      ...n,
      x: G.w / 2 + r * Math.cos(a),
      y: G.h / 2 + r * Math.sin(a),
      vx: 0, vy: 0,
      r: n.kind === "entity" ? Math.min(22, 7 + 2.6 * Math.sqrt(n.weight || 1)) : 4.5,
    };
    byId.set(n.id, node);
    return node;
  });
  G.edges = data.edges
    .map(e => ({ ...e, s: byId.get(e.source), t: byId.get(e.target) }))
    .filter(e => e.s && e.t);
}

function step() {
  const { nodes, edges } = G;
  const cx = G.w / 2, cy = G.h / 2;

  for (const n of nodes) { n.vx *= 0.86; n.vy *= 0.86; }

  // Repulsion — every node pushes every other apart.
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); d2 = 1; }
      const d = Math.sqrt(d2);
      // Entities repel harder, so labelled hubs get room to breathe.
      const force = ((a.kind === "entity" ? 900 : 260) + (b.kind === "entity" ? 900 : 260)) / d2;
      const fx = (dx / d) * force, fy = (dy / d) * force;
      a.vx -= fx; a.vy -= fy; b.vx += fx; b.vy += fy;
    }
  }

  // Springs — an edge pulls its ends toward a rest length.
  for (const e of edges) {
    const rest = e.kind === "relation" ? 120 : 74;
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = (d - rest) * 0.014;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    e.s.vx += fx; e.s.vy += fy; e.t.vx -= fx; e.t.vy -= fy;
  }

  // Gravity toward the middle, so disconnected pieces don't drift away.
  for (const n of nodes) {
    n.vx += (cx - n.x) * 0.0016;
    n.vy += (cy - n.y) * 0.0016;
    if (n.fixed) continue;
    n.x += Math.max(-14, Math.min(14, n.vx));
    n.y += Math.max(-14, Math.min(14, n.vy));
  }
}

function renderGraph() {
  const svg = G.svg;
  if (!G.nodes.length) {
    svg.innerHTML = `<text x="50%" y="50%" text-anchor="middle" fill="#61708a" font-size="13">
      Nothing in the graph yet — journal some work, then Distill.</text>`;
    return;
  }
  const parts = [`<g transform="translate(${G.tx},${G.ty}) scale(${G.scale})">`];

  for (const e of G.edges) {
    const relation = e.kind === "relation";
    parts.push(`<line x1="${e.s.x}" y1="${e.s.y}" x2="${e.t.x}" y2="${e.t.y}"
      stroke="${relation ? "#6366f1" : "#223049"}"
      stroke-width="${relation ? 1.6 : 0.9}" ${relation ? "" : 'stroke-dasharray="2 3"'} />`);
    if (relation && e.label) {
      parts.push(`<text class="edge-label" x="${(e.s.x + e.t.x) / 2}"
        y="${(e.s.y + e.t.y) / 2 - 3}" text-anchor="middle">${esc(e.label)}</text>`);
    }
  }

  for (const n of G.nodes) {
    const colour = n.kind === "entity" ? (TYPE_COLOR[n.type] || TYPE_COLOR.other) : "#475569";
    parts.push(`<circle data-id="${esc(n.id)}" cx="${n.x}" cy="${n.y}" r="${n.r}"
      fill="${colour}" fill-opacity="${n.kind === "entity" ? .85 : .55}"
      stroke="${colour}" stroke-width="1.4" style="cursor:pointer" />`);
    if (n.kind === "entity") {
      parts.push(`<text class="node-label" x="${n.x}" y="${n.y + n.r + 11}"
        text-anchor="middle">${esc(n.label)}</text>`);
    }
  }

  parts.push("</g>");
  svg.innerHTML = parts.join("");
}

function runLayout(iterations = 220) {
  clearInterval(G.timer);
  let i = 0;
  G.timer = setInterval(() => {
    for (let k = 0; k < 3; k++) step();
    renderGraph();
    if (++i * 3 >= iterations) clearInterval(G.timer);
  }, 16);
}

function initGraphSurface() {
  const svg = $("graph");
  G.svg = svg;
  const size = () => {
    const box = svg.parentElement.getBoundingClientRect();
    G.w = box.width; G.h = box.height;
    svg.setAttribute("viewBox", `0 0 ${G.w} ${G.h}`);
  };
  size();
  new ResizeObserver(size).observe(svg.parentElement);

  let dragging = null, panning = null;

  svg.addEventListener("mousedown", (e) => {
    const id = e.target.getAttribute && e.target.getAttribute("data-id");
    if (id) {
      dragging = G.nodes.find(n => n.id === id);
      if (dragging) dragging.fixed = true;
    } else {
      panning = { x: e.clientX - G.tx, y: e.clientY - G.ty };
      svg.classList.add("dragging");
    }
  });

  window.addEventListener("mousemove", (e) => {
    if (dragging) {
      const box = svg.getBoundingClientRect();
      dragging.x = (e.clientX - box.left - G.tx) / G.scale;
      dragging.y = (e.clientY - box.top - G.ty) / G.scale;
      renderGraph();
    } else if (panning) {
      G.tx = e.clientX - panning.x; G.ty = e.clientY - panning.y;
      renderGraph();
    }
  });

  window.addEventListener("mouseup", () => {
    if (dragging) { dragging.fixed = false; dragging = null; runLayout(60); }
    panning = null; svg.classList.remove("dragging");
  });

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();
    const box = svg.getBoundingClientRect();
    const mx = e.clientX - box.left, my = e.clientY - box.top;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const next = Math.max(0.25, Math.min(3.5, G.scale * factor));
    // Zoom about the pointer, not the origin, so the thing under the
    // cursor stays under the cursor.
    G.tx = mx - (mx - G.tx) * (next / G.scale);
    G.ty = my - (my - G.ty) * (next / G.scale);
    G.scale = next;
    renderGraph();
  }, { passive: false });

  const tip = $("tip");
  svg.addEventListener("mouseover", (e) => {
    const id = e.target.getAttribute && e.target.getAttribute("data-id");
    if (!id) return;
    const node = G.nodes.find(n => n.id === id);
    if (!node) return;
    tip.innerHTML = node.kind === "entity"
      ? `<b>${esc(node.label)}</b><br><span style="color:#61708a">${esc(node.type)} · mentioned ${node.weight}×</span>`
      : `<span style="color:#61708a">${esc(node.type)}</span><br>${esc(node.label)}`;
    tip.style.opacity = 1;
  });
  svg.addEventListener("mousemove", (e) => {
    const box = svg.getBoundingClientRect();
    tip.style.left = (e.clientX - box.left + 14) + "px";
    tip.style.top = (e.clientY - box.top + 14) + "px";
  });
  svg.addEventListener("mouseout", () => { tip.style.opacity = 0; });

  $("legend").innerHTML = Object.entries(TYPE_COLOR)
    .map(([k, v]) => `<span><i style="background:${v}"></i>${k}</span>`).join("")
    + `<span><i style="background:#475569"></i>memory</span>`
    + `<span style="color:#6366f1">— relation</span>`;
}

// ==============================================================  renders
async function loadGraph() {
  const data = await api(`/projects/${encodeURIComponent(project)}/graph`);
  graphData = data;
  $("n-graph").textContent = data.nodes.length ? " " + data.counts.entities : "";
  buildGraph(data);
  runLayout();
}

async function loadMemories() {
  const data = await api(`/projects/${encodeURIComponent(project)}/memories?status=all&limit=300`);
  const live = data.memories.filter(m => m.status === "active");
  const dead = data.memories.filter(m => m.status !== "active");
  $("n-mem").textContent = live.length ? " " + live.length : "";

  const card = (m, isDead) => `
    <div class="card ${isDead ? "dead" : ""}">
      <div class="text">${esc(m.text)}</div>
      <div class="meta">
        <span class="tag t-${esc(m.memory_type)}">${esc(m.memory_type)}</span>
        <span>importance ${m.importance.toFixed(2)}</span><span>·</span>
        <span>${esc(m.source)}</span><span>·</span>
        <span>${day(m.created_at)} ${clock(m.created_at)}</span>
        ${m.access_count ? `<span>·</span><span>recalled ${m.access_count}×</span>` : ""}
        ${isDead ? "" : `<button class="del" data-id="${esc(m.id)}" title="Forget">×</button>`}
      </div>
    </div>`;

  $("memories").innerHTML = (!live.length && !dead.length)
    ? `<div class="empty">No memories yet.<br>Journal some terminal work, then hit <b>Distill</b>.</div>`
    : `<div class="note">Extracted from terminal sessions, Claude Code prompts and uploaded documents — atomic, typed, and connected to the graph.</div>`
      + live.map(m => card(m, false)).join("")
      + (dead.length ? `<div class="label" style="margin:18px 0 8px">Superseded · ${dead.length}</div>
         <div class="note">Facts that stopped being true are retired, not overwritten.</div>`
         + dead.map(m => card(m, true)).join("") : "");
}

async function loadTimeline() {
  const q = session ? `?session=${encodeURIComponent(session)}` : "";
  const data = await api(`/projects/${encodeURIComponent(project)}/events${q}`);
  const events = data.events;
  $("n-ev").textContent = events.length ? " " + events.length : "";

  $("timeline").innerHTML = !events.length
    ? `<div class="empty">Nothing journalled yet.<br>Run <code>memoos install</code>, open a new terminal, and work normally.</div>`
    : `<div class="note">The raw journal — written in under a millisecond per command, so nothing waits on it.
        ${session ? `Filtered to <b>${esc(session)}</b>.` : ""}</div>`
      + events.slice().reverse().map(e => `
        <div class="ev ${e.exit_code ? "fail" : ""}">
          <span class="t">${clock(e.created_at)}</span>
          <span class="k k-${esc(e.kind)}">${esc(e.kind)}</span>
          <span class="x mono">${esc(e.text)}</span>
          ${e.exit_code ? `<span class="code">exit ${e.exit_code}</span>` : ""}
        </div>`).join("");
}

async function loadSessions() {
  const data = await api(`/projects/${encodeURIComponent(project)}/sessions`);
  const rows = data.sessions;
  $("sessions").innerHTML = !rows.length
    ? `<div class="hint">No sessions yet.</div>`
    : rows.map(s => `
      <div class="sess ${session === s.session_id ? "on" : ""}" data-id="${esc(s.session_id)}">
        <div class="top"><span>${day(s.started_at)} ${clock(s.started_at)}</span>
          <span style="color:${s.pending ? "#f59e0b" : "#34d399"}">${s.pending ? s.pending + " pending" : "distilled"}</span></div>
        <div class="sub">${s.events} events${s.failures ? ` · ${s.failures} failed` : ""}</div>
      </div>`).join("");
}

async function loadConnection() {
  const state = await api("/connection");
  const button = $("plug");
  button.classList.toggle("off", !state.connected);
  button.innerHTML = `<span class="dot"></span>${state.connected ? "Connected" : "Disconnected"}`;
  button.title = state.connected
    ? "Terminals are feeding the memory layer — click to detach"
    : (state.shell_off
        ? "Off for one terminal via MEMOOS_OFF — click to attach globally"
        : "Not recording. Recall and search still work — click to attach");
  return state;
}

async function loadStats() {
  const s = await api(`/projects/${encodeURIComponent(project)}/stats`);
  const cells = [["memories", s.memories], ["entities", s.entities],
                 ["relations", s.relations], ["sessions", s.sessions]];
  $("stats").innerHTML = cells.map(([k, v]) => `<div class="pill"><b>${v}</b>${k}</div>`).join("")
    + (s.pending ? `<div class="pill alert"><b>${s.pending}</b>undistilled</div>` : "");
  $("pending-hint").textContent = s.pending
    ? `${s.pending} journalled events not yet in memory.`
    : "Journal is fully distilled.";
}

function renderSearch(payload) {
  const box = `<div style="display:flex;gap:7px;margin-bottom:14px">
      <input id="q" placeholder="ask the memory layer…" style="flex:1" autocomplete="off">
      <button class="btn" id="go">Search</button></div>`;

  let body;
  if (!payload) {
    body = `<div class="empty">Search everything this project remembers.<br>
      Ranked by meaning, not keywords — every hit shows which retriever found it.</div>`;
  } else if (!payload.results.length) {
    body = `<div class="empty">Nothing matched “${esc(payload.query)}”.</div>`;
  } else {
    body = `<div class="note">Reciprocal rank fusion over vector + keyword search, then a graph hop, then nudged by memory strength.</div>`
      + payload.results.map((r, i) => {
        const sim = r.vector_score;
        const w = Math.max(3, Math.round(100 * (sim != null ? sim : (r.keyword_score || .35))));
        const nums = [];
        if (sim != null) nums.push(`<span><b>similarity</b> ${sim.toFixed(3)}</span>`);
        if (r.keyword_score != null) nums.push(`<span><b>bm25</b> ${r.keyword_score.toFixed(2)}</span>`);
        if (r.strength != null) nums.push(`<span><b>strength</b> ${r.strength.toFixed(2)}</span>`);
        nums.push(`<span><b>fused</b> ${r.score.toFixed(4)}</span>`);
        return `<div class="hit">
          <div><span style="color:#61708a" class="mono">#${i + 1}</span> ${esc(r.memory.text)}</div>
          <div class="bar-s"><i style="width:${w}%"></i></div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            ${r.matched_by.map(m => `<span class="badge b-${esc(m)}">${esc(m)}</span>`).join("")}
            ${r.via_entities.length ? `<span class="badge b-graph">via ${esc(r.via_entities.join(", "))}</span>` : ""}
          </div>
          <div class="nums">${nums.join("")}</div></div>`;
      }).join("");
  }

  $("search").innerHTML = box + body;
  const run = async () => {
    const q = $("q").value.trim();
    if (!q) return;
    try {
      const data = await api(`/projects/${encodeURIComponent(project)}/search?q=${encodeURIComponent(q)}&top_k=8`);
      renderSearch(data);
      $("q").value = q;
    } catch (err) { toast("⚠ " + err.message); }
  };
  $("go").onclick = run;
  $("q").onkeydown = (e) => { if (e.key === "Enter") run(); };
}

async function refreshAll() {
  try {
    await Promise.all([loadConnection(), loadStats(), loadSessions(),
                       loadMemories(), loadTimeline(), loadGraph()]);
  } catch (err) {
    toast("⚠ " + err.message, 5000);
  }
}

// ============================================================== plumbing
function showPane(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.pane === name));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + name));
  if (name === "graph") runLayout(60);
  if (name === "search" && !$("q")) renderSearch(null);
}

async function busy(button, label, fn) {
  const original = button.textContent;
  button.disabled = true;
  button.textContent = label;
  try { await fn(); }
  catch (err) { toast("⚠ " + err.message, 5000); }
  finally { button.disabled = false; button.textContent = original; }
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => showPane(t.dataset.pane));
$("relayout").onclick = () => { G.tx = 0; G.ty = 0; G.scale = 1; buildGraph(graphData); runLayout(); };

$("plug").onclick = async (e) => {
  const wasConnected = !e.currentTarget.classList.contains("off");
  try {
    const state = await api("/connection", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ connected: !wasConnected }),
    });
    await loadConnection();
    toast(state.connected
      ? "connected — new terminal activity will be journalled"
      : "disconnected — nothing new is recorded; recall and search still work");
  } catch (err) { toast("⚠ " + err.message); }
};

$("project").onchange = () => { project = $("project").value; session = null; refreshAll(); };

$("do-distill").onclick = (e) => busy(e.target, "⚗ distilling… (runs the model)", async () => {
  const r = await api(`/projects/${encodeURIComponent(project)}/distill`
    + (session ? `?session=${encodeURIComponent(session)}` : ""), { method: "POST" });
  toast(r.chunks_failed
    ? `⚠ ${r.chunks_failed}/${r.chunks_total} chunks timed out — ${r.retained} events kept for a retry`
    : (r.created.length
        ? `${r.created.length} memories from ${r.distilled} events`
        : (r.skipped || "nothing to distill")), r.chunks_failed ? 7000 : 2600);
  if (r.digest) {
    showPane("timeline");
    $("timeline").insertAdjacentHTML("afterbegin",
      `<div class="label">Digest sent to the extractor</div><pre class="digest">${esc(r.digest)}</pre>
       <div class="label" style="margin-top:16px">Journal</div>`);
  }
  await refreshAll();
});

$("do-claude").onclick = (e) => busy(e.target, "⌘ importing…", async () => {
  const r = await api(`/projects/${encodeURIComponent(project)}/claude-import`, { method: "POST" });
  toast(r.imported ? `${r.imported} prompts journalled from ${r.sessions} transcripts`
                   : (r.detail || "nothing new"));
  await refreshAll();
});

$("do-upload").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const button = $("do-upload");
  await busy(button, "📄 reading…", async () => {
    const form = new FormData();
    form.append("file", file);
    const r = await api(`/projects/${encodeURIComponent(project)}/ingest`,
                        { method: "POST", body: form });
    toast(`${file.name}: ${r.summary}`);
    await refreshAll();
  });
  e.target.value = "";
};

$("note").onkeydown = async (e) => {
  if (e.key !== "Enter" || !e.target.value.trim()) return;
  const text = e.target.value.trim();
  e.target.value = "";
  try {
    await api(`/projects/${encodeURIComponent(project)}/note`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    toast("noted — distill to fold it into memory");
    await Promise.all([loadStats(), loadTimeline(), loadSessions()]);
  } catch (err) { toast("⚠ " + err.message); }
};

$("sessions").onclick = (e) => {
  const row = e.target.closest(".sess");
  if (!row) return;
  session = session === row.dataset.id ? null : row.dataset.id;
  loadSessions(); loadTimeline();
};

$("memories").onclick = async (e) => {
  const button = e.target.closest(".del");
  if (!button) return;
  await api(`/projects/${encodeURIComponent(project)}/memories/${button.dataset.id}`,
            { method: "DELETE" });
  refreshAll();
};

(async function start() {
  initGraphSurface();
  const data = await api("/projects");
  project = data.here;
  $("project").innerHTML = data.projects.map(p =>
    `<option value="${esc(p.container)}" ${p.container === project ? "selected" : ""}>
       ${esc(p.container)} · ${p.memories} memories</option>`).join("");
  await refreshAll();
})();
</script>
</body>
