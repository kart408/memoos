<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>College Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #f7f7f8;
  }
  #header {
    background: #1f2937;
    color: white;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #2563eb;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    color: #111827;
    border-bottom-left-radius: 4px;
  }
  .bot.loading { color: #9ca3af; font-style: italic; }
  #inputRow {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid #e5e7eb;
    background: white;
  }
  #inputBox {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  #inputBox:focus { border-color: #2563eb; }
  #sendBtn {
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { background: #9ca3af; cursor: not-allowed; }
</style>
</head>
<body>

<div id="header">College Assistant</div>
<div id="messages"></div>
<div id="inputRow">
  <input id="inputBox" type="text" placeholder="Ask about admissions, fees, deadlines..." autocomplete="off" />
  <button id="sendBtn">Send</button>
</div>

<script>
  // Change this to your deployed API URL when you host it for real
  const API_URL = "http://127.0.0.1:8000/chat";
  const CLIENT_ID = "demo_college";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("inputBox");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    const loadingEl = addMessage("Thinking...", "bot loading");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ client_id: CLIENT_ID, message: text }),
      });
      const data = await response.json();
      loadingEl.textContent = data.reply;
      loadingEl.className = "msg bot";
    } catch (err) {
      loadingEl.textContent = "Sorry, something went wrong connecting to the assistant.";
      loadingEl.className = "msg bot";
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  addMessage("Hi! Ask me about admissions, deadlines, fees, or anything else about the program.", "bot");
</script>

</body>
</html>
